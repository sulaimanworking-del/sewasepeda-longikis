<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sewa Sepeda Longikis</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #faf5ff; }
    /* Membungkus iframe dan menggesernya ke atas untuk menutupi banner Google */
    .iframe-container {
      position: absolute;
      top: -36px; /* Menggeser ke atas sejauh 36px untuk menutupi banner */
      left: 0;
      width: 100%;
      height: calc(100% + 36px);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <!-- GANTI URL DI BAWAH DENGAN LINK GOOGLE APPS SCRIPT ANDA -->
    <iframe src="https://script.google.com/macros/s/AKfycbxUD4ExiaCnJXf2t3OCzVsHwEljoX0hgRffHlsqciHad8_9QXIiE3r2BQghlQ0C5gK-/exec"></iframe>
  </div>
</body>
</html>
